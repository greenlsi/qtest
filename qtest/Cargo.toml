[package]
name = "qtest"
version = "0.2.0"
edition = "2021"
authors = [
    "Román Cárdenas <rcardenas.rod@gmail.com>",
    "Eugenio Cano <eugenio.cano@alumnos.upm.es>",
    "Inés Valcárcel Jiménez <ines.valcarcel@alumnos.upm.es>",
]
description = "Connector for working with the QTest socket"
readme = "README.md"
repository = "https://github.com/greenlsi/qtest"
documentation = "https://docs.rs/qtest"
license = "MIT OR Apache-2.0"
keywords = ["qtest", "socket", "connector", "qemu", "tokio"]
categories = ["embedded", "simulation", "development-tools::testing"]

[dependencies]
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
